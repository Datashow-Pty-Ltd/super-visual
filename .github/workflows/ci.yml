name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run hello:test
      - run: npm run claude:test
      - run: npm run example:test

  package-adventureworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run example:package
      - uses: actions/upload-artifact@v7
        with:
          name: adventureworks-super-visual
          path: examples/adventureworks/dist/Artifacts/*.pbiviz
          if-no-files-found: error

  package-hello-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run hello:package
      - uses: actions/upload-artifact@v7
        with:
          name: hello-world-super-visual
          path: examples/hello-world/dist/Artifacts/*.pbiviz
          if-no-files-found: error

  package-claude-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run claude:package
