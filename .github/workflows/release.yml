name: Release candidate

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run stage:9
      - run: npm run example:package
      - name: Create source and package archives
        run: |
          mkdir -p release
          git archive --format=tar.gz --output=release/super-visual-source.tar.gz HEAD
          cp examples/adventureworks/dist/Artifacts/*.pbiviz release/
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release/*
