name: Release candidate

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run stage:9
      - run: npm run example:package
      - run: npm run hello:package
      - run: npm run security:audit
      - run: npm run security:sbom -- release/sbom.cdx.json
      - name: Create source and package archives
        run: |
          mkdir -p release
          git archive --format=tar.gz --output=release/super-visual-source.tar.gz HEAD
          npm pack --workspace @datashow/super-visual-adapter-claude-dashboard --pack-destination release
          npm pack --workspace @datashow/super-visual-cli --pack-destination release
          npm pack --workspace @datashow/super-visual-compiler --pack-destination release
          npm pack --workspace @datashow/super-visual-compliance --pack-destination release
          npm pack --workspace @datashow/super-visual-contracts --pack-destination release
          npm pack --workspace @datashow/super-visual-fabric --pack-destination release
          npm pack --workspace @datashow/super-visual-runtime-powerbi --pack-destination release
          npm pack --workspace @datashow/super-visual-semantic --pack-destination release
          cp examples/adventureworks/dist/Artifacts/*.pbiviz release/adventureworks.pbiviz
          cp examples/hello-world/dist/Artifacts/*.pbiviz release/hello-world.pbiviz
          cd release
          sha256sum *.pbiviz *.json *.tar.gz *.tgz > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          generate_release_notes: true
          files: release/*
