name: Release candidate

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run stage:9
      - run: npm run example:package
      - run: npm run hello:package
      - run: npm run security:audit
      - run: npm run security:sbom -- release/sbom.cdx.json
      - name: Create source and package archives
        run: |
          mkdir -p release
          git archive --format=tar.gz --output=release/super-visual-source.tar.gz HEAD
          cp examples/adventureworks/dist/Artifacts/*.pbiviz release/adventureworks.pbiviz
          cp examples/hello-world/dist/Artifacts/*.pbiviz release/hello-world.pbiviz
          cd release
          sha256sum *.pbiviz *.json *.tar.gz > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          generate_release_notes: true
          files: release/*
