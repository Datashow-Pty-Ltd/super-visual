contractVersion: 1
shell:
  id: {{PROJECT_ID}}
  title: {{PROJECT_TITLE}}
  defaultPage: overview
  designSystem:
    id: hello-world
    sha256: {{DESIGN_HASH}}
  acceptedConcept: { id: {{PROJECT_ID}} }
  governanceLabel: Power BI governed
  locale: en-AU
  currencyCode: ''
  filterContext: []
  navigation:
    - { page: overview, label: Model catalog }
  theme:
    background: '#F4F7F5'
    surface: '#FFFFFF'
    quietSurface: '#EAF0ED'
    text: '#173C36'
    mutedText: '#5E6D68'
    metadata: '#71807A'
    rule: '#D3DDD8'
    grid: '#E3EAE6'
    accent: '#167D6C'
    attention: '#9B6B23'
    positive: '#2E7D5B'
    negative: '#B84A52'
    context: ['#167D6C', '#6F6A9A']
    dataColors: ['#167D6C', '#6F6A9A', '#9B6B23']
    displayFont: Georgia, serif
    bodyFont: Aptos, Segoe UI, sans-serif
    contentWidth: 1200
    layoutColumns: 12
    layoutGap: 16
    cardRadius: 8
    cardPadding: [20, 20, 20, 20]
    kpiTopAccent: 3
    density: comfortable
    typography: { findingMin: 40, findingMax: 56, sectionTitle: 22, kpiValue: 32, body: 15, chart: 12, table: 13, metadata: 11 }
pages:
  - id: overview
    title: Semantic Model Catalog
    eyebrow: Super Visual / connectivity proof
    summary:
      headline: Hello, semantic model.
      body: Search the declared model entities returned through the governed Super Visual broker.
      emphasisBinding: null
    search:
      placeholder: Search type, parent, or name
      dataset: model-catalog
      filterTarget: Super Visual Model Catalog[Entity]
    kpis: []
    widgets:
      - id: model-catalog
        conceptRegionId: model-catalog
        primitive: ranked-table
        title: Semantic model entities
        subtitle: Generated from the semantic contract and queried through the live adapter
        dataset: model-catalog
        reportWidgetIds: [model-catalog]
        businessQuestionIds: [semantic-connectivity]
        layout: { columns: 12, minHeight: 420 }
        settings: { orientation: null, curve: null, showLegend: false, showLabels: true, sort: ascending, limit: 100, emphasis: null }
interactions: []
designRationale:
  narrative: Make the smallest sample an inspectable proof that React is receiving governed semantic-model rows.
  decisions:
    - Replace arbitrary business data with a generated semantic-model catalog.
    - Keep search client-side so it is immediate and does not create model filters.
  accessibility:
    - Use a labelled search field, semantic table headings, visible connection status, and text counts.
  risks:
    - Catalog rows prove the report-to-semantic-provider path; source refresh remains a separate deployment acceptance check.
