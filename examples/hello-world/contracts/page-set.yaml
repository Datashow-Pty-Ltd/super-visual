        format: currency-compact
        comparison: null
    widgets:
      - id: sales
        conceptRegionId: sales
        primitive: bar
        title: Sales by category
        subtitle: Governed data from the semantic model
        dataset: sales
        reportWidgetIds: [sales]
        businessQuestionIds: [sales-mix]
        layout: { columns: 12, minHeight: 320 }
        settings: { orientation: horizontal, curve: null, showLegend: false, showLabels: true, sort: descending, limit: 10, emphasis: bars }
interactions: []
designRationale:
  narrative: Demonstrate the smallest complete Super Visual project.
  decisions:
    - Keep the example to one page, one dataset, one measure, and one chart.
  accessibility:
    - Use semantic headings, a native list, visible values, and no colour-only meaning.
  risks:
    - A Fabric deployment still requires a reachable SQL endpoint and connection binding.
